services:
  gcli2api:
    image: ghcr.io/sta1n156/gcli2api:latest
    build: .
    container_name: gcli2api
    restart: unless-stopped
    ports:
      - "${PORT:-7861}:7861"
    environment:
      PASSWORD: ${PASSWORD:-pwd}
      HOST: 0.0.0.0
      PORT: 7861
    volumes:
      - ./data/creds:/app/creds
