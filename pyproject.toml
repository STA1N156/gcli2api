[project]
name = "gcli2api"
version = "0.1.0"
description = "Convert Antigravity to OpenAI, Gemini and Anthropic API interfaces"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "CNC-1.0"}
authors = [
    {name = "su-kaka"}
]
keywords = ["gemini", "openai", "api", "converter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi>=0.116.1",
    "httpx[http2,socks]>=0.28.1",
    "hypercorn>=0.17.3",
    "motor>=3.7.1",
    "oauthlib>=3.3.1",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "pypinyin>=0.51.0",
    "aiosqlite>=0.20.0",
    "redis>=7.2.0",
    "asyncpg>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
]
